[project]
name = "sarvagyan-server"
version = "1.0.0"
description = "Sarvagyan backend: auth, call coordination, WebRTC signalling and the real-time translation pipeline"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real Gnani and MyMemory APIs (opt-in: pytest -m live)"]
addopts = "-m 'not live'"
