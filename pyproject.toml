[project]
name = "kuralcheck"
version = "0.1.0"
description = "Tamil speech stress-test kit for Gnani Prisma"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "numpy>=1.26",
    "soundfile>=0.12",
    "jiwer>=3.0",
    "matplotlib>=3.8",
    "streamlit>=1.40",
    "imageio-ffmpeg>=0.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
]
whisper = [
    "faster-whisper>=1.2.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
extraPaths = ["app"]
