<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="app.css" />
    <style>
      body { width: 360px; }
      main { padding: 12px 14px 14px; }
      header { padding: 10px 14px; position: static; }
      textarea { min-height: 70px; }
      .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon32.png" alt="" style="width:22px;height:22px" />
      <h1 style="font-size:15px">KuralCheck</h1>
      <span id="health" class="pill">…</span>
    </header>
    <main>
      <label for="q" style="margin-top:0">Quick test (one Tamil sentence)</label>
      <textarea id="q" class="ta" placeholder="நாளைக்கு கடைக்கு வாங்க"></textarea>
      <div class="actions"><button id="go" class="primary">Test</button><span id="st" class="status"></span></div>
      <div id="out"></div>
      <div class="quick">
        <button class="secondary" data-open="text">Full tester</button>
        <button class="secondary" data-open="voice">Record voice</button>
        <button class="secondary" data-open="score">Score transcript</button>
        <button class="secondary" data-open="bench">Benchmark</button>
      </div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
